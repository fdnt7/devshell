default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# The hooks this repository provides, from the dev shell's packages; they
# mirror .pre-commit-hooks.yaml
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ascii-only"
name = "ascii only"
entry = "ascii-only"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "cog-verify"
name = "conventional commit message"
entry = "cog verify --file"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "commit-msg-length"
name = "commit message 50/72"
entry = "commit-msg-length"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "no-co-authors"
name = "no co-authors"
entry = "no-co-authors"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "treefmt"
name = "treefmt"
entry = "treefmt --no-cache --fail-on-change"
language = "system"

[[repos.hooks]]
id = "typos"
name = "typos"
entry = "typos"
language = "system"
pass_filenames = false
